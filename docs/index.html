<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Stany w marketach</title>
<style>
:root{
  --bg:#f6f5f2; --card:#fff; --ink:#1d2329; --muted:#6b7280; --line:#e4e2dc;
  --accent:#1f3a5f; --accent-ink:#fff; --red:#b42318; --red-bg:#fdecea; --amber:#8a5a00; --amber-bg:#fff4d6;
  --green:#1e6b3a; --green-bg:#e6f4ea;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#121417; --card:#1b1f24; --ink:#e7e9ec; --muted:#9aa3ad; --line:#2c3238;
    --accent:#8fb4e3; --accent-ink:#0f1720; --red:#ff8a80; --red-bg:#3a1d1b; --amber:#ffd27a; --amber-bg:#3a2f14;
    --green:#8fd7a5; --green-bg:#16301f; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:8px 0 16px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
#login{max-width:380px;margin:12vh auto 0}
#login h1{margin-bottom:6px}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 4px}
input,select,button{font:inherit;color:inherit}
input[type=password],input[type=search],select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
button{padding:10px 14px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;font-weight:600}
button.ghost{background:transparent;color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
.err{color:var(--red);font-size:13px;min-height:1.2em;margin-top:8px}
.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:end}
.check{display:flex;gap:8px;align-items:center;font-size:14px;padding:10px 0}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:120px}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:14px}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--bg);position:sticky;top:0}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.idx{display:block;color:var(--muted);font-size:12px}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}
.p-red{background:var(--red-bg);color:var(--red)} .p-amb{background:var(--amber-bg);color:var(--amber)} .p-grn{background:var(--green-bg);color:var(--green)}
a{color:var(--accent)}
.more{text-align:center;margin:14px 0}
.hidden{display:none}
@media (max-width:820px){
  .filters{grid-template-columns:1fr 1fr}
  thead{display:none} table,tbody,tr,td{display:block;width:100%}
  tr{border-bottom:1px solid var(--line);padding:8px 4px}
  td{border:0;padding:3px 8px} td.num{text-align:left}
  td[data-l]::before{content:attr(data-l) ": ";color:var(--muted);font-size:12px}
}
@media (max-width:480px){ .filters{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap">

  <section id="login" class="card">
    <h1>Stany w marketach</h1>
    <p class="sub" id="lastUpdate">Ceramika Paradyż · Leroy Merlin, Castorama, OBI</p>
    <form id="loginForm">
      <label for="pw">Hasło</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <div class="err" id="loginErr"></div>
      <button type="submit" id="loginBtn" style="width:100%;margin-top:6px">Otwórz</button>
    </form>
  </section>

  <section id="app" class="hidden">
    <header>
      <div>
        <h1>Stany w marketach</h1>
        <div class="sub" id="genInfo"></div>
      </div>
      <div class="actions">
        <button class="ghost" id="csvBtn">Pobierz widok (CSV)</button>
        <button id="xlsBtn">Pobierz pełny raport (Excel)</button>
      </div>
    </header>

    <div class="card filters">
      <div><label for="fMarket">Sieć</label>
        <select id="fMarket"><option value="">Wszystkie</option></select></div>
      <div><label for="fStore">Sklep</label>
        <select id="fStore"><option value="">Wszystkie sklepy</option></select></div>
      <div><label for="fText">Produkt / EAN / indeks / miasto</label>
        <input id="fText" type="search" placeholder="np. Arctic, Gdańsk"></div>
      <div>
        <label class="check"><input type="checkbox" id="fSig"> Tylko sygnały (braki, niski stan)</label>
        <label class="check" style="padding-top:0"><input type="checkbox" id="fOnline"> Pokaż sklep internetowy</label>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><b id="sRows">0</b><span>pozycji</span></div>
      <div class="stat"><b id="sProd">0</b><span>produktów</span></div>
      <div class="stat"><b id="sStores">0</b><span>sklepów</span></div>
      <div class="stat"><b id="sSig">0</b><span>sygnałów</span></div>
    </div>

    <table>
      <thead><tr><th>Produkt</th><th>Sieć / sklep</th><th>Stan (opak.)</th><th>Stan m²</th>
        <th>Sygnał</th><th>Stan Paradyż</th><th>Cena/m²</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="more"><button class="ghost hidden" id="moreBtn">Pokaż więcej</button></div>
  </section>
</div>

<script>
const PAGE = 300;
let DATA = null, PW = null, view = [], shown = 0;
const $ = id => document.getElementById(id);
const store = { get(k){ try{return sessionStorage.getItem(k)}catch(e){return null} },
                set(k,v){ try{sessionStorage.setItem(k,v)}catch(e){} } };
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function decrypt(url, pw){
  const r = await fetch(url + "?t=" + Date.now());
  if(!r.ok) throw new Error("Brak danych na serwerze (" + r.status + ")");
  const d = await r.json();
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(d.salt), iterations:d.iter, hash:"SHA-256"},
                                            base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  try { return await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(d.iv)}, key, b64(d.ct)); }
  catch(e){ throw new Error("Nieprawidłowe hasło"); }
}
async function gunzipJson(buf){
  const s = new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(s).text());
}

async function login(pw){
  $("loginBtn").disabled = true; $("loginErr").textContent = "";
  try {
    DATA = await gunzipJson(await decrypt("dane.enc", pw));
    PW = pw; store.set("pw", pw);
    $("login").classList.add("hidden"); $("app").classList.remove("hidden");
    init();
  } catch(e){ $("loginErr").textContent = e.message; }
  $("loginBtn").disabled = false;
}

const fmt = (v, d=0) => v==null || v==="" ? "" : (typeof v==="number" ? v.toLocaleString("pl-PL",{maximumFractionDigits:d}) : v);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function init(){
  $("genInfo").textContent = "Odczyt: " + DATA.generated + " · " + DATA.rows.length.toLocaleString("pl-PL") + " pozycji";
  const markets = [...new Set(DATA.rows.map(r => r.m))].filter(Boolean).sort();
  markets.forEach(m => $("fMarket").add(new Option(m, m)));
  fillStores();
  ["fMarket","fStore","fText","fSig","fOnline"].forEach(id => $(id).addEventListener("input", () => { if(id==="fMarket") fillStores(); apply(); }));
  $("moreBtn").onclick = () => render(false);
  $("csvBtn").onclick = downloadCsv;
  $("xlsBtn").onclick = downloadXlsx;
  apply();
}
function fillStores(){
  const m = $("fMarket").value, sel = $("fStore"), cur = sel.value;
  const stores = [...new Set(DATA.rows.filter(r => (!m || r.m===m) && r.s && r.s!=="Sklep internetowy" && r.s!=="—")
                    .map(r => (m ? "" : r.m + " · ") + r.s))].sort((a,b)=>a.localeCompare(b,"pl"));
  sel.length = 1; stores.forEach(s => sel.add(new Option(s, s)));
  if(stores.includes(cur)) sel.value = cur;
}
function apply(){
  const m = $("fMarket").value, st = $("fStore").value, t = $("fText").value.trim().toLowerCase();
  const sig = $("fSig").checked, online = $("fOnline").checked;
  view = DATA.rows.filter(r => {
    if(m && r.m !== m) return false;
    if(st && (m ? r.s : r.m + " · " + r.s) !== st) return false;
    if(!online && r.s === "Sklep internetowy") return false;
    if(sig && !r.sg) return false;
    if(t && !((r.n||"")+" "+(r.e||"")+" "+(r.i||"")+" "+(r.s||"")).toLowerCase().includes(t)) return false;
    return true;
  });
  view.sort((a,b) => (b.sg?1:0)-(a.sg?1:0) || (a.n||"").localeCompare(b.n||"","pl") || (a.s||"").localeCompare(b.s||"","pl"));
  $("sRows").textContent = view.length.toLocaleString("pl-PL");
  $("sProd").textContent = new Set(view.map(r=>r.e)).size.toLocaleString("pl-PL");
  $("sStores").textContent = new Set(view.map(r=>r.m+r.s)).size.toLocaleString("pl-PL");
  $("sSig").textContent = view.filter(r=>r.sg).length.toLocaleString("pl-PL");
  render(true);
}
function pill(r){
  if(r.sg){ const red = /^Brak/.test(r.sg); return `<span class="pill ${red?"p-red":"p-amb"}">${esc(r.sg)}</span>`; }
  if(r.st === "NIE_ZNALEZIONO") return `<span class="pill p-amb">Brak w ofercie online sieci</span>`;
  if(typeof r.q === "number" && r.q > 0) return `<span class="pill p-grn">OK</span>`;
  return "";
}
function render(reset){
  if(reset){ $("rows").innerHTML = ""; shown = 0; }
  const part = view.slice(shown, shown + PAGE);
  $("rows").insertAdjacentHTML("beforeend", part.map(r => `<tr>
    <td>${esc(r.n)}<span class="idx">${esc(r.i)} · EAN ${esc(r.e)}</span></td>
    <td data-l="Sklep">${esc(r.m)}<span class="idx">${esc(r.s)}</span></td>
    <td class="num" data-l="Stan (opak.)">${esc(fmt(r.q))}</td>
    <td class="num" data-l="Stan m²">${esc(fmt(r.qm,2))}</td>
    <td>${pill(r)}</td>
    <td class="num" data-l="Paradyż">${esc(fmt(r.p))} ${esc(r.j||"")}</td>
    <td class="num" data-l="Cena/m²">${r.c ? esc(fmt(r.c,2))+" zł" : ""}</td>
    <td>${r.u ? `<a href="${esc(r.u)}" target="_blank" rel="noopener">oferta</a>` : ""}</td></tr>`).join(""));
  shown += part.length;
  $("moreBtn").classList.toggle("hidden", shown >= view.length);
}
function save(blob, name){
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();}, 1000);
}
function downloadCsv(){
  const head = ["Sieć","Sklep","EAN","Indeks","Produkt","Stan (opak.)","Stan m2","Sygnał","Stan Paradyż","JM","Cena/m2","Link"];
  const keys = ["m","s","e","i","n","q","qm","sg","p","j","c","u"];
  const q = v => { v = v==null ? "" : String(v); if(typeof v==="string" && /^\d+\.\d+$/.test(v)) v = v.replace(".",","); return /[;"\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
  const lines = [head.join(";")].concat(view.map(r => keys.map(k => q(typeof r[k]==="number" ? String(r[k]).replace(".",",") : r[k])).join(";")));
  save(new Blob(["﻿" + lines.join("\r\n")], {type:"text/csv;charset=utf-8"}), "stany_widok_" + DATA.generated.slice(0,10) + ".csv");
}
async function downloadXlsx(){
  $("xlsBtn").disabled = true;
  try { const buf = await decrypt("raport.enc", PW);
        save(new Blob([buf], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}), "stany_magazynowe_" + DATA.generated.slice(0,10) + ".xlsx"); }
  catch(e){ alert(e.message); }
  $("xlsBtn").disabled = false;
}

$("loginForm").addEventListener("submit", e => { e.preventDefault(); login($("pw").value); });
fetch("stan.json?t=" + Date.now()).then(r => r.ok ? r.json() : null).then(s => {
  if(s) $("lastUpdate").textContent = "Ostatni odczyt: " + s.generated + " · Leroy Merlin, Castorama, OBI";
}).catch(()=>{});
const saved = store.get("pw"); if(saved) login(saved);
</script>
</body>
</html>
