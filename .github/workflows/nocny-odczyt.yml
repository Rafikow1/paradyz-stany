name: Nocny odczyt stanów

on:
  schedule:
    # odczyt rano, po otwarciu marketów (6:00) – sieci aktualizują stany na stronie dopiero wtedy
    # kilka terminów, bo GitHub potrafi opóźnić start; pierwszy robi odczyt, kolejne kończą się od razu
    - cron: "7 6 * * *"          # ok. 07:07 zimą (latem 08:07)
    - cron: "22 6 * * *"         # ok. 07:22
    - cron: "37 6 * * *"         # ok. 07:37
  workflow_dispatch:
    inputs:
      limit:
        description: "Test: ile produktów na część (puste = wszystkie)"
        required: false
        default: ""
      rynki:
        description: "Test: które sieci, np. 'obi castorama' (puste = wszystkie)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: nocny-odczyt
  cancel-in-progress: false

env:
  DATA_PASSWORD: ${{ secrets.DATA_PASSWORD }}
  PYTHONUNBUFFERED: "1"
  TZ: Europe/Warsaw

jobs:
  sprawdz:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.c.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - run: git fetch -q --depth 1 origin dane-strony || true
      - id: c
        run: |
          python3 - <<'PY' >> $GITHUB_OUTPUT
          import json, os
          from datetime import datetime
          run = "1"
          if os.environ.get("GITHUB_EVENT_NAME") == "schedule":
              try:
                  import subprocess
                  raw = subprocess.run(["git", "show", "origin/dane-strony:stan.json"], capture_output=True, text=True).stdout
                  g = json.loads(raw or open("docs/stan.json").read())["generated"]
                  age = (datetime.now() - datetime.strptime(g[:16], "%Y-%m-%d %H:%M")).total_seconds() / 3600
                  if age < 10:
                      run = "0"
              except Exception:
                  pass
          print(f"run={run}")
          PY
          cat $GITHUB_OUTPUT

  odczyt:
    needs: sprawdz
    if: needs.sprawdz.outputs.run == '1'
    name: Odczyt ${{ matrix.siec }} ${{ matrix.czesc }}
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy:
      fail-fast: false
      max-parallel: 19
      matrix:
        include:
          - { siec: leroy, czesc: "1/6", nr: 1 }
          - { siec: leroy, czesc: "2/6", nr: 2 }
          - { siec: leroy, czesc: "3/6", nr: 3 }
          - { siec: leroy, czesc: "4/6", nr: 4 }
          - { siec: leroy, czesc: "5/6", nr: 5 }
          - { siec: leroy, czesc: "6/6", nr: 6 }
          - { siec: castorama, czesc: "1/12", nr: 1 }
          - { siec: castorama, czesc: "2/12", nr: 2 }
          - { siec: castorama, czesc: "3/12", nr: 3 }
          - { siec: castorama, czesc: "4/12", nr: 4 }
          - { siec: castorama, czesc: "5/12", nr: 5 }
          - { siec: castorama, czesc: "6/12", nr: 6 }
          - { siec: castorama, czesc: "7/12", nr: 7 }
          - { siec: castorama, czesc: "8/12", nr: 8 }
          - { siec: castorama, czesc: "9/12", nr: 9 }
          - { siec: castorama, czesc: "10/12", nr: 10 }
          - { siec: castorama, czesc: "11/12", nr: 11 }
          - { siec: castorama, czesc: "12/12", nr: 12 }
          - { siec: obi, czesc: "1/1", nr: 1 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Przygotowanie
        id: prep
        run: |
          WANT="${{ github.event.inputs.rynki }}"
          if [ -n "$WANT" ] && ! echo " $WANT " | grep -q " ${{ matrix.siec }} "; then echo "skip=1" >> $GITHUB_OUTPUT; exit 0; fi
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          python -m utils.publish decrypt dane/input.xlsx.enc input.xlsx
          mkdir -p data
          cp dane/url_map.json data/url_map.json 2>/dev/null || true
          cp dane/lm_wspolrzedne_miast.json data/lm_wspolrzedne_miast.json 2>/dev/null || true
          cp dane/castorama_sklepy.json data/castorama_sklepy.json 2>/dev/null || true
      - name: Odczyt sklepów
        if: steps.prep.outputs.skip != '1'
        continue-on-error: true
        timeout-minutes: 150
        run: |
          ARGS="--input input.xlsx --rynki ${{ matrix.siec }} --czesc ${{ matrix.czesc }} --limit-czasu 130"
          if [ -n "${{ github.event.inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"; fi
          xvfb-run -a python main.py $ARGS
      - name: Dokończenie nieudanych
        if: steps.prep.outputs.skip != '1'
        continue-on-error: true
        timeout-minutes: 50
        run: |
          if ls output/stany_magazynowe_2*.xlsx >/dev/null 2>&1; then
            xvfb-run -a python main.py --input input.xlsx --rynki ${{ matrix.siec }} --czesc ${{ matrix.czesc }} --dokoncz --limit-czasu 40
          fi
      - name: Wyniki (zaszyfrowane)
        if: always() && steps.prep.outputs.skip != '1'
        run: python -m utils.pack_result wynik
      - uses: actions/upload-artifact@v4
        if: always() && steps.prep.outputs.skip != '1'
        with:
          name: wynik-${{ matrix.siec }}-${{ matrix.nr }}
          path: wynik/
          retention-days: 14

  druga_runda:
    needs: [sprawdz, odczyt]
    if: always() && needs.sprawdz.outputs.run == '1'
    name: Poprawka ${{ matrix.siec }} ${{ matrix.czesc }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        include:
          - { siec: leroy, czesc: "1/6", nr: 1 }
          - { siec: leroy, czesc: "2/6", nr: 2 }
          - { siec: leroy, czesc: "3/6", nr: 3 }
          - { siec: leroy, czesc: "4/6", nr: 4 }
          - { siec: leroy, czesc: "5/6", nr: 5 }
          - { siec: leroy, czesc: "6/6", nr: 6 }
          - { siec: castorama, czesc: "1/12", nr: 1 }
          - { siec: castorama, czesc: "2/12", nr: 2 }
          - { siec: castorama, czesc: "3/12", nr: 3 }
          - { siec: castorama, czesc: "4/12", nr: 4 }
          - { siec: castorama, czesc: "5/12", nr: 5 }
          - { siec: castorama, czesc: "6/12", nr: 6 }
          - { siec: castorama, czesc: "7/12", nr: 7 }
          - { siec: castorama, czesc: "8/12", nr: 8 }
          - { siec: castorama, czesc: "9/12", nr: 9 }
          - { siec: castorama, czesc: "10/12", nr: 10 }
          - { siec: castorama, czesc: "11/12", nr: 11 }
          - { siec: castorama, czesc: "12/12", nr: 12 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: wynik-${{ matrix.siec }}-${{ matrix.nr }}
          path: poprzedni
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Czy trzeba poprawiać?
        id: need
        run: |
          WANT="${{ github.event.inputs.rynki }}"
          if [ -n "$WANT" ] && ! echo " $WANT " | grep -q " ${{ matrix.siec }} "; then echo "retry=0" >> $GITHUB_OUTPUT; exit 0; fi
          pip install -q cryptography pandas openpyxl
          python -m utils.pack_result needs-retry poprzedni >> $GITHUB_OUTPUT
          cat $GITHUB_OUTPUT
      - name: Ponowny odczyt na nowym serwerze
        if: steps.need.outputs.retry == '1'
        continue-on-error: true
        timeout-minutes: 75
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          python -m utils.publish decrypt dane/input.xlsx.enc input.xlsx
          mkdir -p data output
          cp dane/url_map.json data/url_map.json 2>/dev/null || true
          cp dane/lm_wspolrzedne_miast.json data/lm_wspolrzedne_miast.json 2>/dev/null || true
          cp dane/castorama_sklepy.json data/castorama_sklepy.json 2>/dev/null || true
          python -m utils.pack_result restore poprzedni output
          xvfb-run -a python main.py --input input.xlsx --rynki ${{ matrix.siec }} --czesc ${{ matrix.czesc }} --dokoncz --limit-czasu 60
      - name: Wyniki (zaszyfrowane)
        if: always() && steps.need.outputs.retry == '1'
        run: python -m utils.pack_result wynik
      - uses: actions/upload-artifact@v4
        if: always() && steps.need.outputs.retry == '1'
        with:
          name: wynik2-${{ matrix.siec }}-${{ matrix.nr }}
          path: wynik/
          retention-days: 14

  publikacja:
    needs: [sprawdz, odczyt, druga_runda]
    if: always() && needs.sprawdz.outputs.run == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # najnowsze ustawienia (np. regiony), nawet jeśli zmieniły się w trakcie odczytu
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          path: wyniki
      - name: Poprzednie dane (do uzupełnienia braków)
        run: |
          if git fetch -q --depth 1 origin dane-strony; then
            mkdir -p docs && git show FETCH_HEAD:raport.enc > docs/raport.enc
            git show FETCH_HEAD:historia.enc > docs/historia.enc 2>/dev/null || rm -f docs/historia.enc
          fi
      - name: Odszyfrowanie i scalenie
        run: |
          for f in $(find wyniki -name "stany_magazynowe_2*.xlsx.enc"); do python -m utils.publish decrypt "$f" "${f%.enc}"; done
          python -m utils.merge wyniki output
          LM=$(find wyniki -name lm_wspolrzedne_miast.json | head -1); [ -n "$LM" ] && cp "$LM" dane/lm_wspolrzedne_miast.json || true
          cp data/url_map.json dane/url_map.json
          CS=$(find wyniki -name castorama_sklepy.json -size +2k | head -1); [ -n "$CS" ] && cp "$CS" dane/castorama_sklepy.json || true
      - name: Historia stanów i szacunek sprzedaży
        continue-on-error: true    # błąd historii nie może zatrzymać strony; stary plik zostaje nienaruszony
        run: |
          mkdir -p docs
          python -m utils.historia update docs/historia.enc wyniki docs/sprzedaz.enc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historia
          path: docs/historia.enc
          retention-days: 90
          if-no-files-found: ignore
      - name: Publikacja na stronie
        if: github.event.inputs.limit == '' || github.event.inputs.limit == null
        run: python -m utils.publish site output/stany_magazynowe_AKTUALNE.xlsx docs
      - name: Dane strony (gałąź dane-strony – zawsze tylko najnowsza wersja)
        if: github.event.inputs.limit == '' || github.event.inputs.limit == null
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/strona && mkdir /tmp/strona && cp docs/dane.enc docs/raport.enc docs/stan.json /tmp/strona/
          for f in historia.enc sprzedaz.enc; do [ -s docs/$f ] && cp docs/$f /tmp/strona/; done
          cd /tmp/strona && git init -q -b dane-strony
          git config user.name "nocny-odczyt" && git config user.email "actions@users.noreply.github.com"
          git add . && git commit -qm "Dane $(date +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do
            git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" dane-strony && exit 0
            echo "Zapis nieudany, próba $i"; sleep $((i * 20))
          done
          exit 1
      - name: Zapis do repozytorium
        run: |
          git checkout -- docs 2>/dev/null || true
          git config user.name "nocny-odczyt"
          git config user.email "actions@users.noreply.github.com"
          git add dane/url_map.json dane/lm_wspolrzedne_miast.json dane/castorama_sklepy.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Odczyt $(date +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do   # GitHub czasem chwilowo odrzuca zapis – ponawiamy
            git pull --rebase -q origin main && git push && exit 0
            echo "Zapis nieudany, próba $i – czekam"; sleep $((i * 20))
          done
          exit 1
