name: Diagnoza cen

on:
  workflow_dispatch:

env:
  DATA_PASSWORD: ${{ secrets.DATA_PASSWORD }}
  PYTHONUNBUFFERED: "1"
  TZ: Europe/Warsaw

jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        include:
          - siec: leroy
            eany: ""
          - siec: castorama
            eany: "5902610530975 5902610531033 5063022581204"
          - siec: obi
            eany: ""
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - run: |
          mkdir -p data && cp dane/url_map.json data/url_map.json
          xvfb-run -a python -m utils.diag_ceny ${{ matrix.siec }} ${{ matrix.eany }}
