name: Katalog rozpoznanie
on:
  workflow_dispatch:
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        siec: [leroy, castorama, obi]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - run: mkdir -p data && xvfb-run -a python -m utils.katalog_diag ${{ matrix.siec }}
